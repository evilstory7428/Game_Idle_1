<!-- Smooth Motion Patch v2 -->
<script>'use strict';
/* Smooth Motion Patch v2
   - 6 source sprite frames -> 12-step visual timeline
   - feet stay on a locked ground anchor
   - attack preparation -> impact -> recoil -> recovery
   - hit/damage events synchronized to the impact pose
   - subtle 1~3 px / rotation / scale procedural motion
*/
(()=>{
  if(typeof ATLAS_INFO==='undefined' || typeof actor!=='function' || typeof hero!=='function') return;

  const SOURCE_FRAMES=6;
  const VIRTUAL_FRAMES=12;
  const IMPACT_AT=.52;
  const oldMotionStart=motionStart;

  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const smoothstep=t=>{t=clamp(t);return t*t*(3-2*t)};
  const easeInOut=t=>.5-.5*Math.cos(Math.PI*clamp(t));
  const mix=(a,b,t)=>a+(b-a)*t;

  // Keep existing combat timings, but align one-shot impact events to the visual strike frame.
  motionStart=function(id,kind,duration,events=[]){
    const synced=events.map(e=>{
      let at=e.at;
      if(kind==='attack') at=IMPACT_AT;
      else if((kind==='ultimate'||kind==='aoe') && Math.abs(at-.44)<.015) at=IMPACT_AT;
      return {...e,at};
    });
    return oldMotionStart(id,kind,duration,synced);
  };

  function attackSource(progress){
    const p=clamp(progress);
    // 0~42% prepare, 42~56% strike, 56~72% recoil, 72~100% recover.
    if(p<.42) return mix(0,2.15,easeInOut(p/.42));
    if(p<.56) return mix(2.15,3.75,smoothstep((p-.42)/.14));
    if(p<.72) return mix(3.75,4.65,easeInOut((p-.56)/.16));
    return mix(4.65,5,easeInOut((p-.72)/.28));
  }

  function loopSource(kind,elapsed,duration){
    if(kind==='idle'){
      const u=(elapsed%1.8)/1.8;
      // Ping-pong across all six real frames while retaining continuous sub-frame time.
      return (u<=.5?u*2:(1-u)*2)*5;
    }
    const p=clamp(duration>0?elapsed/duration:1);
    if(kind==='attack') return attackSource(p);
    if(kind==='ultimate') return 5*easeInOut(p);
    if(kind==='aoe') return 5*smoothstep(p);
    return 5*p;
  }

  function virtualState(kind,elapsed,duration){
    const src=loopSource(kind,elapsed,duration);
    // Snap only the logical animation phase to 12 steps; transforms stay 60fps continuous.
    const v=Math.round((src/5)*(VIRTUAL_FRAMES-1));
    const snapped=v/(VIRTUAL_FRAMES-1)*5;
    const a=Math.floor(snapped);
    const b=Math.min(SOURCE_FRAMES-1,a+1);
    let blend=snapped-a;
    // Short smooth crossfade prevents a persistent ghost/double-image look.
    blend=smoothstep(clamp((blend-.20)/.60));
    return {a,b,blend,src,virtual:v,progress:clamp(duration>0?elapsed/duration:0)};
  }

  function paintFrame(context,id,row,col,x,y,height,alpha){
    const meta=ATLAS_INFO[id],im=imageAssets[id];
    if(!meta||!im?.naturalWidth)return;
    const f=meta.frames[row*SOURCE_FRAMES+col];
    if(!f)return;
    const scale=height/meta.bodyHeight;

    // x/y is the foot/ground anchor. Every frame uses its own authored anchorX/anchorY,
    // so the visible sole remains on exactly the same world-space point.
    const gx=Math.round(x*2)/2, gy=Math.round(y*2)/2;
    const dx=gx-f.anchorX*scale,dy=gy-f.anchorY*scale;
    context.save();
    context.globalAlpha*=alpha;
    if(f.clip){
      context.beginPath();
      f.clip.forEach(([px,py],i)=>{
        const cx=dx+px*scale,cy=dy+py*scale;
        if(i===0)context.moveTo(cx,cy);else context.lineTo(cx,cy);
      });
      context.closePath();context.clip();
    }
    context.drawImage(im,f.x,f.y,f.w,f.h,dx,dy,f.w*scale,f.h*scale);
    context.restore();
  }

  function paintSmooth(context,id,row,state,x,y,height,alpha=1){
    // Base frame remains fully opaque; adjacent frame is introduced briefly around the transition.
    paintFrame(context,id,row,state.a,x,y,height,alpha);
    if(state.b!==state.a && state.blend>.001){
      const overlay=Math.sin(Math.PI*state.blend)*.48;
      paintFrame(context,id,row,state.b,x,y,height,alpha*overlay);
      if(state.blend>.58) paintFrame(context,id,row,state.b,x,y,height,alpha*clamp((state.blend-.58)/.42));
    }
  }

  function motionTransform(kind,elapsed,duration,id){
    const p=clamp(duration>0?elapsed/duration:0);
    let x=0,rot=0,sx=1,sy=1;
    if(kind==='idle'){
      const wave=Math.sin(elapsed*Math.PI*2/1.8);
      // Breathing around the foot pivot: feet do not move vertically.
      x=wave*.55;
      rot=wave*.0028;
      sx=1-wave*.0015;
      sy=1+wave*.0045;
    }else if(kind==='attack'){
      if(p<.42){
        const q=easeInOut(p/.42);x=1.2*q;rot=.006*q;
      }else if(p<.56){
        const q=smoothstep((p-.42)/.14);x=mix(1.2,2.2,q);rot=mix(.006,.011,q);
      }else if(p<.72){
        const q=easeInOut((p-.56)/.16);x=mix(-2.6,-.5,q);rot=mix(-.014,-.004,q);sx=1+.008*(1-q);sy=1-.006*(1-q);
      }else{
        const q=easeInOut((p-.72)/.28);x=mix(-.5,0,q);rot=mix(-.004,0,q);
      }
    }else if(kind==='ultimate'){
      const pulse=Math.sin(Math.PI*p);
      x=Math.sin(elapsed*15)*1.2*pulse;rot=Math.sin(elapsed*10)*.006*pulse;sx=1+.012*pulse;sy=1+.009*pulse;
    }else if(kind==='aoe'){
      const pulse=Math.sin(Math.PI*p);
      x=Math.sin(elapsed*13)*1.6*pulse;rot=Math.sin(elapsed*8)*.008*pulse;sx=1+.008*pulse;sy=1+.012*pulse;
    }
    // Large characters get slightly less translation so feet/torso do not visually skid.
    const h=hero(id)?.height||174;
    const weight=clamp(174/h,.72,1.05);
    return {x:x*weight,rot:rot*weight,sx,sy};
  }

  // Preserve API compatibility for previews or other callers that still ask for one frame index.
  frameIndex=function(kind,t,duration){
    return virtualState(kind,t,duration).a;
  };

  drawHero=function(id,x,y){
    const a=actor(id),h=hero(id),m=a.motion;
    let kind=m?.kind||'idle',elapsed=m?.elapsed||time,duration=m?.duration||1.8;
    if(kind==='aoe'&&duration>5){duration=id==='elona'?.36:.5;elapsed%=duration}
    if(kind==='ultimate'&&id==='luna'){duration=.5;elapsed%=duration}

    const row=MOTION_ROWS[kind]??MOTION_ROWS.idle;
    const state=virtualState(kind,elapsed,duration);
    const tf=motionTransform(kind,elapsed,duration,id);
    const groundX=Math.round(x*2)/2,groundY=Math.round((y+10)*2)/2;

    ellipse(x,y+7,24,6,'#14232c40');
    ctx.save();
    // All transforms pivot around the locked foot anchor.
    ctx.translate(groundX,groundY);
    ctx.translate(tf.x,0);
    ctx.rotate(tf.rot);
    ctx.scale(tf.sx,tf.sy);
    paintSmooth(ctx,id,row,state,0,0,135*h.height/174,a.hp<=0?.3:1);
    ctx.restore();

    rect(x-25,y+16,50,4,'#122123cc');
    rect(x-25,y+16,50*Math.max(0,a.hp/stats(id).hp),4,'#b5d5b4');
    if(a.shield>0){ctx.strokeStyle='#f9dfa7b0';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-55,53,80,0,0,Math.PI*2);ctx.stroke()}
    if(a.hp<=0)label(Math.ceil(a.dead)+'s',x,y-52,13,'#f2d6a2');
    else if(a.reload>0)label('장전',x,y+33,10,'#fff0c9');
  };

  // Expose diagnostics without affecting save data or balance.
  window.SmoothMotion={
    version:2,
    sourceFrames:SOURCE_FRAMES,
    virtualFrames:VIRTUAL_FRAMES,
    impactAt:IMPACT_AT,
    state:virtualState
  };
})();
</script>
